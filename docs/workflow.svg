<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 1200 330" width="1200" height="330" role="img" aria-label="Review lifecycle: submitted, in review, approved, changes requested or rejected; changes loop back to a new version" xmlns:c2pa="http://c2pa.org/manifest">
<style>
text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}

@keyframes glow{0%{opacity:0}2%,9%{opacity:1}14%,100%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-24}}
.g{opacity:0;animation:glow 9s ease-in-out infinite both}
.fl{stroke-dasharray:6 6;animation:flow 1.2s linear infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/></linearGradient></defs>

<rect y="-30" width="1200" height="330" rx="18" fill="#f4fbf9" stroke="#cfe6e2"/>
<rect x="40" y="110" width="170" height="70" rx="14" fill="#ffffff" stroke="#cfe6e2"/><text x="125.0" y="140" font-size="16" font-weight="700" fill="#0a2a27" text-anchor="middle">Submitted</text><text x="125.0" y="160" font-size="12" fill="#4d716c" text-anchor="middle">AI analysis runs</text>
<rect x="290" y="110" width="170" height="70" rx="14" fill="#e8f7f4" stroke="#0d9488"/><text x="375.0" y="140" font-size="16" font-weight="700" fill="#0a2a27" text-anchor="middle">In review</text><text x="375.0" y="160" font-size="12" fill="#0d9488" text-anchor="middle">Reviewer + manager</text>
<rect x="620" y="30" width="190" height="70" rx="14" fill="#e6f7ef" stroke="#a7e3c7"/><text x="715.0" y="60" font-size="16" font-weight="700" fill="#047857" text-anchor="middle">Approved</text><text x="715.0" y="80" font-size="12" fill="#047857" text-anchor="middle">Ready to publish</text>
<rect x="620" y="115" width="190" height="70" rx="14" fill="#fff6e5" stroke="#f2d59b"/><text x="715.0" y="145" font-size="16" font-weight="700" fill="#b45309" text-anchor="middle">Changes requested</text><text x="715.0" y="165" font-size="12" fill="#b45309" text-anchor="middle">Feedback to author</text>
<rect x="620" y="200" width="190" height="70" rx="14" fill="#fdeeee" stroke="#f3bcbc"/><text x="715.0" y="230" font-size="16" font-weight="700" fill="#b91c1c" text-anchor="middle">Rejected</text><text x="715.0" y="250" font-size="12" fill="#b91c1c" text-anchor="middle">Reason recorded</text>
<rect x="930" y="115" width="230" height="70" rx="14" fill="#ffffff" stroke="#cfe6e2" stroke-dasharray="5 5"/><text x="1045" y="145" font-size="16" font-weight="700" fill="#0a2a27" text-anchor="middle">New version</text><text x="1045" y="165" font-size="12" fill="#4d716c" text-anchor="middle">History keeps every revision</text>
<rect x="617" y="27" width="196" height="76" rx="17" fill="none" stroke="#10b981" stroke-width="3" class="g" style="animation-delay:1.3s"/><rect x="617" y="112" width="196" height="76" rx="17" fill="none" stroke="#f59e0b" stroke-width="3" class="g" style="animation-delay:4.3s"/><rect x="617" y="197" width="196" height="76" rx="17" fill="none" stroke="#ef4444" stroke-width="3" class="g" style="animation-delay:7.3s"/>
<g fill="none" stroke="#0d9488" stroke-width="2" class="fl"><path d="M212 145h76"/><path d="M462 135C520 135 540 65 616 65"/><path d="M462 145H616"/><path d="M462 155C520 155 540 235 616 235"/></g>
<path d="M812 150H926" fill="none" stroke="#f59e0b" stroke-width="2" class="fl"/>
<path d="M1045 112V70C1045 40 1000 26 600 26C380 26 375 60 375 106" fill="none" stroke="#f59e0b" stroke-width="2" class="fl"/>
<text x="1045" y="22" font-size="12" fill="#4d716c" text-anchor="middle">Resubmit for another review</text>
<g><circle r="7" fill="#10b981"><animateMotion dur="9s" repeatCount="indefinite" path="M212 145H375 C440 145 540 65 616 65" keyPoints="0;0;1;1" keyTimes="0;0.0000;0.3333;1" calcMode="linear"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0100;0.3233;0.3333;1"/></circle></g><g><circle r="7" fill="#f59e0b"><animateMotion dur="9s" repeatCount="indefinite" path="M212 145H375 H616" keyPoints="0;0;1;1" keyTimes="0;0.3333;0.6667;1" calcMode="linear"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.3333;0.3433;0.6567;0.6667;1"/></circle></g><g><circle r="7" fill="#ef4444"><animateMotion dur="9s" repeatCount="indefinite" path="M212 145H375 C440 145 540 235 616 235" keyPoints="0;0;1;1" keyTimes="0;0.6667;1.0000;1" calcMode="linear"/><animate attributeName="opacity" dur="9s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.6667;0.6767;0.9900;1.0000;1"/></circle></g>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
