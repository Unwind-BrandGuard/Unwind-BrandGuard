<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Architecture: teams use the React frontend, which authenticates with Supabase Auth and calls the Express API; the API uses Gemini, Brevo and Supabase" xmlns:c2pa="http://c2pa.org/manifest">
<style>
text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}

@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes breathe{0%,100%{opacity:.0}50%{opacity:1}}
.fl{stroke-dasharray:6 6;animation:flow 1s linear infinite}
.br{animation:breathe 3.5s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
