<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Illustration of the compliance analytics dashboard with score trend and most violated guidelines" xmlns:c2pa="http://c2pa.org/manifest">
<style>
text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}

@keyframes line{0%{stroke-dashoffset:900}22%,85%{stroke-dashoffset:0}95%,100%{stroke-dashoffset:900}}
@keyframes area{0%,10%{opacity:0}28%,85%{opacity:1}95%,100%{opacity:0}}
@keyframes pop{0%,18%{transform:scale(0)}26%,85%{transform:scale(1)}95%,100%{transform:scale(0)}}
@keyframes bar{0%{transform:scaleX(0)}18%,85%{transform:scaleX(1)}95%,100%{transform:scaleX(0)}}
@keyframes cardin{0%{opacity:0;transform:translateY(14px)}6%,90%{opacity:1;transform:none}96%,100%{opacity:0}}
.ln{stroke-dasharray:900;stroke-dashoffset:900;animation:line 10s ease-in-out infinite both}
.ar{opacity:0;animation:area 10s ease-in-out infinite both}
.pt{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop 10s ease-out infinite both}
.br{transform-box:fill-box;transform-origin:left;animation:bar 10s cubic-bezier(.2,.8,.2,1) infinite both}
.k{opacity:0;animation:cardin 10s ease-out infinite both}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a0c9a9"/><stop offset="1" stop-color="#365d48"/></linearGradient><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8a68" stop-opacity=".35"/><stop offset="1" stop-color="#4f8a68" stop-opacity="0"/></linearGradient></defs>

<rect width="1200" height="520" rx="18" fill="#f7f5f0" stroke="#e1e5dc"/>
<text x="40" y="52" font-size="22" font-weight="700" fill="#263a30">Compliance analytics</text><text x="40" y="76" font-size="13" fill="#718076">Last 30 days · all channels · sample data</text>
<g class="k" style="animation-delay:0s"><rect x="40" y="96" width="270" height="96" rx="14" fill="#ffffff" stroke="#e1e5dc" /><text x="60" y="126" font-size="13" fill="#718076">Average compliance score</text><text x="60" y="168" font-size="38" font-weight="800" fill="#365d48">84</text><text x="118" y="166" font-size="13" font-weight="600" fill="#047857">▲ 9 vs last period</text></g>
<g class="k" style="animation-delay:0.15s"><rect x="330" y="96" width="270" height="96" rx="14" fill="#ffffff" stroke="#e1e5dc" /><text x="350" y="126" font-size="13" fill="#718076">Content reviewed</text><text x="350" y="168" font-size="38" font-weight="800" fill="#263a30">248</text></g><g class="k" style="animation-delay:0.3s"><rect x="620" y="96" width="270" height="96" rx="14" fill="#ffffff" stroke="#e1e5dc" /><text x="640" y="126" font-size="13" fill="#718076">Approved first time</text><text x="640" y="168" font-size="38" font-weight="800" fill="#263a30">71%</text></g><g class="k" style="animation-delay:0.45s"><rect x="910" y="96" width="250" height="96" rx="14" fill="#ffffff" stroke="#e1e5dc" /><text x="930" y="126" font-size="13" fill="#718076">Open high-severity findings</text><text x="930" y="168" font-size="38" font-weight="800" fill="#b91c1c">6</text></g>
<rect x="40" y="212" width="620" height="272" rx="14" fill="#ffffff" stroke="#e1e5dc" /><text x="60" y="240" font-size="14" font-weight="700" fill="#263a30">Score trend</text>
<g stroke="#eeefe9" stroke-width="1.5"><path d="M60 280H640"/><path d="M60 330H640"/><path d="M60 380H640"/><path d="M60 430H640"/></g>
<path d="M60 410 L130 395 L200 372 L270 380 L340 340 L410 322 L480 300 L550 292 L640 270 V430 H60Z" fill="url(#ar)" class="ar"/>
<path d="M60 410 L130 395 L200 372 L270 380 L340 340 L410 322 L480 300 L550 292 L640 270" fill="none" stroke="url(#ac)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="ln"/>
<g fill="#ffffff" stroke="#365d48" stroke-width="2.5"><circle cx="60" cy="410" r="5" class="pt" style="animation-delay:0.4s"/><circle cx="200" cy="372" r="5" class="pt" style="animation-delay:0.52s"/><circle cx="340" cy="340" r="5" class="pt" style="animation-delay:0.64s"/><circle cx="480" cy="300" r="5" class="pt" style="animation-delay:0.76s"/><circle cx="640" cy="270" r="5" class="pt" style="animation-delay:0.88s"/></g>
<g font-size="11" fill="#98a69c" text-anchor="middle"><text x="60" y="456">Week 1</text><text x="200" y="456">Week 2</text><text x="340" y="456">Week 3</text><text x="480" y="456">Week 4</text><text x="620" y="456">Today</text></g>
<rect x="680" y="212" width="480" height="272" rx="14" fill="#ffffff" stroke="#e1e5dc" /><text x="700" y="240" font-size="14" font-weight="700" fill="#263a30">Most violated guidelines</text><text x="700" y="278" font-size="13" fill="#263a30">Claims &amp; substantiation</text><rect x="700" y="286" width="420" height="10" rx="5" fill="#eeefe9"/><rect x="700" y="286" width="364" height="10" rx="5" fill="#ef4444" class="br" style="animation-delay:0.2s"/><text x="700" y="326" font-size="13" fill="#263a30">Terminology</text><rect x="700" y="334" width="420" height="10" rx="5" fill="#eeefe9"/><rect x="700" y="334" width="270" height="10" rx="5" fill="#f59e0b" class="br" style="animation-delay:0.35s"/><text x="700" y="374" font-size="13" fill="#263a30">Tone of voice</text><rect x="700" y="382" width="420" height="10" rx="5" fill="#eeefe9"/><rect x="700" y="382" width="214" height="10" rx="5" fill="#f59e0b" class="br" style="animation-delay:0.5s"/><text x="700" y="422" font-size="13" fill="#263a30">Accessibility</text><rect x="700" y="430" width="420" height="10" rx="5" fill="#eeefe9"/><rect x="700" y="430" width="132" height="10" rx="5" fill="#4f8a68" class="br" style="animation-delay:0.6499999999999999s"/>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
