<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Unwind BrandGuard banner: Define. Analyze. Protect." xmlns:c2pa="http://c2pa.org/manifest">
<style>
text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ping{0%{transform:scale(1);opacity:.45}100%{transform:scale(1.9);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes rise{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
@keyframes draw{0%,8%{stroke-dashoffset:120}30%,82%{stroke-dashoffset:0}95%,100%{stroke-dashoffset:120}}
@keyframes scan{0%{transform:translateY(-120px)}100%{transform:translateY(120px)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-20px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.ring{transform-origin:0 0;animation:spin 50s linear infinite}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 3.2s ease-out infinite}
.bob{animation:bob 4.5s ease-in-out infinite}
.check{stroke-dasharray:120;animation:draw 5s ease-in-out infinite}
.scan{animation:scan 3.2s ease-in-out infinite alternate}
.blob{animation:drift 14s ease-in-out infinite}
.bar{transform-box:fill-box;transform-origin:left;animation:grow .9s .1s cubic-bezier(.2,.8,.2,1) both}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a0c9a9"/><stop offset="1" stop-color="#365d48"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9efe4"/></linearGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#d3dccf"/></pattern>
<radialGradient id="glow"><stop offset="0" stop-color="#a0c9a9" stop-opacity=".55"/><stop offset="1" stop-color="#a0c9a9" stop-opacity="0"/></radialGradient>
<linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f8a68" stop-opacity="0"/><stop offset=".5" stop-color="#4f8a68" stop-opacity=".45"/><stop offset="1" stop-color="#4f8a68" stop-opacity="0"/></linearGradient>
<clipPath id="shieldClip"><path d="M0 -92 L78 -62 V6 C78 56 40 88 0 104 C-40 88 -78 56 -78 6 V-62 Z"/></clipPath>
<clipPath id="rr"><rect width="1280" height="400" rx="20"/></clipPath>
</defs>

<g clip-path="url(#rr)">
<rect width="1280" height="400" fill="url(#bg)"/><rect width="1280" height="400" fill="url(#dots)"/>
<circle cx="220" cy="360" r="170" fill="#cfe3d3" opacity=".25" class="blob"/>
<circle cx="640" cy="40" r="120" fill="#bcd8c4" opacity=".18" class="blob" style="animation-delay:-6s"/>
</g>
<rect x=".5" y=".5" width="1279" height="399" rx="20" fill="none" stroke="#e1e5dc"/>

<g transform="translate(1010 200)">
  <circle r="250" fill="url(#glow)"/>
  <circle r="96" fill="none" stroke="#365d48" stroke-width="2" class="ping"/>
  <circle r="96" fill="none" stroke="#365d48" stroke-width="2" class="ping" style="animation-delay:1.6s"/>
  <g class="ring"><circle r="150" fill="none" stroke="#365d48" stroke-opacity=".35" stroke-dasharray="4 10"/><circle cx="150" cy="0" r="6" fill="#4f8a68"/></g>
  <circle r="118" fill="none" stroke="#365d48" stroke-opacity=".18"/>
  <path d="M0 -92 L78 -62 V6 C78 56 40 88 0 104 C-40 88 -78 56 -78 6 V-62 Z" fill="#fff" stroke="url(#ac)" stroke-width="6"/>
  <path d="M0 -70 L58 -47 V4 C58 41 30 65 0 78 C-30 65 -58 41 -58 4 V-47 Z" fill="#eeefe9"/>
  <g clip-path="url(#shieldClip)"><rect x="-80" y="-12" width="160" height="24" fill="url(#scanG)" class="scan"/></g>
  <path class="check" d="M-30 4 L-8 28 L34 -22" fill="none" stroke="url(#ac)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</g><g transform="translate(790 86)"><g class="bob" style="animation-delay:0s"><rect width="122" height="34" rx="17" fill="#e6f7ef" stroke="#a7e3c7"/><circle cx="19" cy="17" r="5.5" fill="#10b981"/><text x="33" y="22" font-size="14" font-weight="600" fill="#047857">On brand</text></g></g><g transform="translate(850 292)"><g class="bob" style="animation-delay:1.2s"><rect width="142" height="34" rx="17" fill="#fff6e5" stroke="#f2d59b"/><circle cx="19" cy="17" r="5.5" fill="#f59e0b"/><text x="33" y="22" font-size="14" font-weight="600" fill="#b45309">Tone drift</text></g></g><g transform="translate(1118 112)"><g class="bob" style="animation-delay:2.1s"><rect width="112" height="34" rx="17" fill="#fdeeee" stroke="#f3bcbc"/><circle cx="19" cy="17" r="5.5" fill="#ef4444"/><text x="33" y="22" font-size="14" font-weight="600" fill="#b91c1c">Claim</text></g></g>
<text x="80" y="128" font-size="22" font-weight="700" fill="#365d48" letter-spacing="3" class="rise">UNWIND</text>
<rect x="80" y="142" width="120" height="5" rx="2.5" fill="url(#ac)" class="bar"/>
<text x="80" y="228" font-size="80" font-weight="800" fill="#263a30" letter-spacing="-2.5" class="rise" style="animation-delay:.15s">BrandGuard</text>
<text x="80" y="282" font-size="30" font-weight="600" fill="#365d48" class="rise" style="animation-delay:.5s">Define.</text>
<text x="190" y="282" font-size="30" font-weight="600" fill="#4f8a68" class="rise" style="animation-delay:.9s">Analyze.</text>
<text x="322" y="282" font-size="30" font-weight="600" fill="#263a30" class="rise" style="animation-delay:1.3s">Protect.</text>
<text x="80" y="330" font-size="18" fill="#718076" class="rise" style="animation-delay:1.7s">AI-powered, human-controlled brand governance for teams that care about consistency.</text>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
