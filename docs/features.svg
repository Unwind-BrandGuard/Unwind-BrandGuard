<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 414" width="1200" height="414" role="img" aria-label="Six core capabilities: workspaces and roles, living guidelines, explainable AI analysis, image and PDF review, human-controlled approval, compliance analytics" xmlns:c2pa="http://c2pa.org/manifest">
<style>
text{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif}

@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes in{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:none}}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.c{opacity:0;animation:in .7s cubic-bezier(.2,.8,.2,1) forwards}
.f{animation:fl 5s ease-in-out infinite}
.t{animation:tw 2.4s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs><linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a0c9a9"/><stop offset="1" stop-color="#365d48"/></linearGradient></defs>
<g transform="translate(16 16)"><g transform="translate(0 0)"><g class="c" style="animation-delay:0.0s"><g class="f" style="animation-delay:0.0s"><rect x="0" y="0" width="368" height="176" rx="18" fill="#ffffff" stroke="#e1e5dc" /><rect x="28" y="0" width="44" height="4" rx="2" fill="url(#ac)"/><g transform="translate(28 30)"><rect x="0" y="6" width="34" height="28" rx="6" fill="#eeefe9" stroke="#365d48" stroke-width="2.5"/><path d="M8 6V3h18v3" fill="none" stroke="#365d48" stroke-width="2.5"/></g><text x="28" y="96" font-size="18" font-weight="800" fill="#263a30">Workspaces and roles</text><text x="28" y="118" font-size="14" fill="#718076">Isolated data per workspace, role-based</text><text x="28" y="140" font-size="14" fill="#718076">permissions, protected owners.</text></g></g></g><g transform="translate(400 0)"><g class="c" style="animation-delay:0.12s"><g class="f" style="animation-delay:-0.8s"><rect x="0" y="0" width="368" height="176" rx="18" fill="#ffffff" stroke="#e1e5dc" /><rect x="28" y="0" width="44" height="4" rx="2" fill="url(#ac)"/><g transform="translate(28 30)"><rect x="3" y="0" width="28" height="36" rx="6" fill="#eeefe9" stroke="#365d48" stroke-width="2.5"/><path d="M10 11h14M10 18h14M10 25h8" stroke="#365d48" stroke-width="2.5" stroke-linecap="round"/></g><text x="28" y="96" font-size="18" font-weight="800" fill="#263a30">Living guidelines</text><text x="28" y="118" font-size="14" fill="#718076">Voice, terminology, claims and facts</text><text x="28" y="140" font-size="14" fill="#718076">become the rules AI checks against.</text></g></g></g><g transform="translate(800 0)"><g class="c" style="animation-delay:0.24s"><g class="f" style="animation-delay:-1.6s"><rect x="0" y="0" width="368" height="176" rx="18" fill="#ffffff" stroke="#e1e5dc" /><rect x="28" y="0" width="44" height="4" rx="2" fill="url(#ac)"/><g transform="translate(28 30)"><path d="M17 0l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#4f8a68"/></g><text x="28" y="96" font-size="18" font-weight="800" fill="#263a30">Explainable AI analysis</text><text x="28" y="118" font-size="14" fill="#718076">Every finding shows evidence, the</text><text x="28" y="140" font-size="14" fill="#718076">guideline it breaks and a suggested fix.</text></g></g></g><g transform="translate(0 206)"><g class="c" style="animation-delay:0.36s"><g class="f" style="animation-delay:-2.4000000000000004s"><rect x="0" y="0" width="368" height="176" rx="18" fill="#ffffff" stroke="#e1e5dc" /><rect x="28" y="0" width="44" height="4" rx="2" fill="url(#ac)"/><g transform="translate(28 30)"><rect x="0" y="3" width="34" height="28" rx="6" fill="#eeefe9" stroke="#365d48" stroke-width="2.5"/><path d="M4 27l9-11 6 7 4-5 7 9z" fill="#a0c9a9"/><circle cx="25" cy="11" r="3" fill="#365d48"/></g><text x="28" y="96" font-size="18" font-weight="800" fill="#263a30">Image and PDF review</text><text x="28" y="118" font-size="14" fill="#718076">Check visuals and documents, or text</text><text x="28" y="140" font-size="14" fill="#718076">together with a file, in one pass.</text></g></g></g><g transform="translate(400 206)"><g class="c" style="animation-delay:0.48s"><g class="f" style="animation-delay:-3.2s"><rect x="0" y="0" width="368" height="176" rx="18" fill="#ffffff" stroke="#e1e5dc" /><rect x="28" y="0" width="44" height="4" rx="2" fill="url(#ac)"/><g transform="translate(28 30)"><circle cx="17" cy="17" r="16" fill="#e6f7ef" stroke="#10b981" stroke-width="2.5"/><path d="M9 18l6 6 11-12" fill="none" stroke="#047857" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="28" y="96" font-size="18" font-weight="800" fill="#263a30">Human-controlled approval</text><text x="28" y="118" font-size="14" fill="#718076">Approve, reject or request changes.</text><text x="28" y="140" font-size="14" fill="#718076">Version history keeps every revision.</text></g></g></g><g transform="translate(800 206)"><g class="c" style="animation-delay:0.6s"><g class="f" style="animation-delay:-4.0s"><rect x="0" y="0" width="368" height="176" rx="18" fill="#ffffff" stroke="#e1e5dc" /><rect x="28" y="0" width="44" height="4" rx="2" fill="url(#ac)"/><g transform="translate(28 30)"><rect x="2" y="18" width="7" height="16" rx="2" fill="#365d48"/><rect x="14" y="8" width="7" height="26" rx="2" fill="#4f8a68"/><rect x="26" y="0" width="7" height="34" rx="2" fill="#a0c9a9"/></g><text x="28" y="96" font-size="18" font-weight="800" fill="#263a30">Compliance analytics</text><text x="28" y="118" font-size="14" fill="#718076">Spot recurring violations and track how</text><text x="28" y="140" font-size="14" fill="#718076">your brand consistency improves.</text></g></g></g></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
