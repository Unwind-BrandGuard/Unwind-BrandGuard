<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Layered security: authenticated session, workspace membership, role-based access, row level security, protected secrets" xmlns:c2pa="http://c2pa.org/manifest">
